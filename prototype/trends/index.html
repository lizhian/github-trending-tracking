<!doctype html>
<html lang="zh-CN" data-prototype="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Trend Radar · GitHub 趋势追踪原型</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23635bdf'/%3E%3Cpath d='M6 22l7-9 5 5 8-12' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" type="module"></script>
</head>
<body>
  <!-- Three throwaway UI directions, on one route, switchable via ?variant=A|B|C. -->
  <a class="skip-link" href="#results">跳转到项目列表</a>
  <div id="app"></div>
  <div id="prototype-controls"></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <dialog id="about-dialog" aria-labelledby="about-title">
    <form method="dialog"><button class="icon-button close-dialog" aria-label="关闭数据说明">×</button></form>
    <span class="eyebrow">ABOUT THE DATA</span>
    <h2 id="about-title">看见变化，也了解数据。</h2>
    <p>这是用于评审页面布局和交互的原型。仓库名称用于示意，所有 Star、趋势、追踪时长和更新状态均为模拟数据，不代表真实榜单。</p>
    <div class="about-grid"><div><b>10 分钟</b><span>发现趋势项目</span></div><div><b>1 小时</b><span>记录 Star 快照</span></div><div><b>30 天</b><span>最长观测窗口</span></div></div>
    <p>正式版采用 GitHub 仓库 Topics，历史不足时标记“部分观测”；入库前的数据不会补造。入库未满 24 小时的项目不会被清理。</p>
    <p class="muted">原型不会调用 GitHub、写入数据库或保存你的操作。</p>
  </dialog>
</body>
</html>
